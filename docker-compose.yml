services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodex
      POSTGRES_PASSWORD: nodex
      POSTGRES_DB: nodex
    ports:
      - "5433:5432"
    volumes:
      - nodex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodex"]
      interval: 5s
      retries: 10

volumes:
  nodex-pgdata:
